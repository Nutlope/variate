<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loam, soil health analytics</title>
<style>
:root{
  --bg:#faf7f2; --ink:#211d16; --ink-2:#5c554a; --ink-3:#96907f;
  --accent:#3d6b43; --accent-hi:#4e8a56; --paper:#ffffff; --rule:#e7e0d2;
  --radius:14px; --pad-x:clamp(20px,6vw,72px);
  --fs-hero:clamp(40px,6vw,72px); --fs-h2:clamp(26px,3.4vw,40px); --fs-body:16.5px; --fs-meta:13px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;font-size:var(--fs-body);line-height:1.6}
h1,h2,h3{font-weight:600;letter-spacing:-0.02em;line-height:1.06}
.wrap{max-width:1160px;margin:0 auto;padding:0 var(--pad-x)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:12px 22px;font-size:15px;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid transparent}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hi)}
.btn-ghost{border-color:var(--rule);color:var(--ink)}
.meta{font-size:var(--fs-meta);color:var(--ink-3);text-transform:uppercase;letter-spacing:0.12em}
section{padding:72px 0}
</style>
